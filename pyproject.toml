[project]
name = "agentkg"
version = "0.1.0"
description = "Biomedical Agent Knowledge Graph pipeline (SPEC.md)"
readme = "SPEC.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic-settings>=2.4",
    "google-genai>=0.3",
]

[project.scripts]
agentkg = "agentkg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentkg"]
