name: Weekly catalog refresh

# Regenerates data/graph.json + data/agents/*.md + data/_provenance.json from the
# current sources (lists, OpenAlex, GitHub) and commits the result back to main.
# The push triggers the Cloudflare deploy. Manual run available via "Run workflow".

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC (tune as you like)
  workflow_dispatch: {}

permissions:
  contents: write # commit the regenerated data/ back to main

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      KG_BACKEND: vertex
      GOOGLE_CLOUD_PROJECT: bioc-u24
      GOOGLE_CLOUD_LOCATION: global
      KG_GEMINI_MODEL: gemini-3.1-flash-lite
      KG_PROFILE_MODEL: gemini-3.1-flash-lite
      KG_DISCOVER_ROUNDS: "1"
      # built-in token: authenticates the README/repo crawl (1000 req/hr) and the push
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Vertex AI)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      # Reuse the model + README caches across runs to save tokens; the cache key
      # rotates each run so newly-extracted entries persist for next time.
      - name: Restore extraction cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: kg-cache-${{ github.run_id }}
          restore-keys: kg-cache-

      # Drop the OpenAlex/citation + repo-health caches so citations, discovered
      # agents, and star counts refresh weekly (classify/facets/READMEs stay cached).
      - name: Refresh time-sensitive caches
        run: rm -rf .cache/citers .cache/openalex .cache/workmeta .cache/workrefs .cache/repo

      - name: Regenerate catalog
        run: |
          rm -f data/agents/*.md   # regenerate cleanly; stale profiles don't linger
          uv run agentkg run -b vertex --sources -p 1000

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Catalog unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "chore(data): weekly catalog refresh ($(date -u +%F))"
          git push
